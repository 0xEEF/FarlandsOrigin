org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Paper/Minecraft
# Set this to whatever you're actually deploying to. It only controls which
# dev bundle we compile against (i.e. which NMS method signatures javac
# checks your code against) - it does NOT need to exactly match the server
# jar you run, since 26.1 and 26.2 share the same unobfuscated runtime; it's
# just safest to keep them matched. "26.1.2.build.+" / "26.2.build.+"
# auto-resolve to the latest published build for that version (see
# https://docs.papermc.io/paper/dev/project-setup/) - pin an exact build
# (e.g. 26.1.2.build.8) once you've settled on one, so rebuilds don't
# silently pick up a newer Paper build later.
minecraft_version=26.1.2
paperweight_version=2.0.0-beta.21

# Mod properties
# No specific Paper version baked into this on purpose - the same jar is
# meant to work across 26.1+/26.2+ (see minecraft_version above for what
# that's actually verified against).
mod_version=1.0.0
maven_group=dev.xeaf.farlandsorigin

# Dependencies
# ASM 9.8+ is required for Java 25 support (class file major version 69) -
# 9.7.1 and earlier throw "Unsupported class file major version 69" on any
# class compiled by a JDK 25 javac, which is exactly the server's own NMS
# classes on 26.1/26.2. Bump this further if a future JDK needs it too.
asm_version=9.8
shadow_version=8.3.5
