org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Paper/Minecraft
# This build targets Minecraft 26.3+. 26.3 rewrote the density function system
# (DensityFunction moved packages and lost compute()/SimpleFunction), so it
# does NOT load on 26.2 or older - use a 1.0.x build there.
# "26.3.build.+" resolves to the latest published build for that version (see
# https://docs.papermc.io/paper/dev/userdev/) - pin an exact build once
# you've settled on one so rebuilds don't silently pick up a newer Paper build.
minecraft_version=26.3
paperweight_version=2.0.0-beta.24

# Mod properties
mod_version=1.1.1
maven_group=dev.xeaf.farlandsorigin

# Dependencies
# ASM 9.8+ is required for Java 25 support (class file major version 69) -
# 9.7.1 and earlier throw "Unsupported class file major version 69" on any
# class compiled by a JDK 25 javac, which is exactly the server's own NMS
# classes on 26.1/26.2. Bump this further if a future JDK needs it too.
asm_version=9.9.1
shadow_version=8.3.5
